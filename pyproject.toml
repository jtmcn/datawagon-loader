[tool.poetry]
name = "datawagon"
version = "1.2.1"
description = "Automated loading of YouTube Analytics files into a PostgreSQL database"
authors = ["JM <jtmcn.dev@gmail.com>"]
license = "MIT"
readme = "readme.md"
packages = [{ include = "datawagon" }]

[tool.poetry.scripts]
datawagon = "datawagon.main:start_cli"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
click = "^8.1.3"
rich = "^13.7.0"
python-dotenv = "^1.2.2"
pandas = "^2.0.2"
toml = "^0.10.2"
pydantic = "^2.3"
google-cloud-storage = "^3.7.0"
google-cloud-bigquery = "^3.38.0"
platformdirs = "^3.0.0,<4.0.0"

# Security constraints - minimum safe versions
certifi = ">=2024.7.4"          # PYSEC-2024-230
requests = ">=2.33.0"           # GHSA-gc5v-m9x4-r6x2
urllib3 = ">=2.7.0"             # GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j
idna = ">=3.15"                 # GHSA-65pc-fj4g-8rjx
protobuf = ">=5.29.6,<8.0.0"    # GHSA-7gcm-g887-7qv7
pyasn1 = ">=0.6.4"              # GHSA-m4p7-r5rc-7g4j and 4 others

[tool.poetry.group.dev.dependencies]
mypy = "^1.4.1"
flake8 = "^6.0.0"
isort = "^5.12.0"
black = "^26.3.1"
types-toml = "^0.10.8.6"
pre-commit = "^3.3.3"
types-click = "^7.1.8"
poetry-plugin-export = "^1.6.0"
pyinstaller = "^6.0.0"
vulture = "^2.11"


[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.0.0"


[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
namespace_packages = true
explicit_package_bases = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
